{# templates/base.html #}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>ZEDYTH Tech Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* ===== Logo ===== */
        .top-header .sidebar-brand {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            line-height: 0;
        }
        .top-header .sidebar-brand img {
            height: 46px;
            width: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ===== Header: todo en una fila mientras quepa ===== */
        html, body { max-width: 100%; overflow-x: hidden; }
        .top-header { box-sizing: border-box; max-width: 100%; }
        .top-header:not(.nav-collapsed) { flex-wrap: nowrap; }
        .top-header .nav-links,
        .top-header .header-right { flex-shrink: 0; }
        .top-header .nav-item { white-space: nowrap; }
        .top-header .header-right .search-box { flex: 0 1 220px; width: auto; min-width: 150px; }
        .top-header .header-right .search-box input { min-width: 0; width: 100%; }
        .content-area { box-sizing: border-box; min-width: 0; max-width: 100%; }

        /* Solo existen cuando el menú está colapsado */
        .menu-toggle { display: none; }
        .nav-links .search-box { display: none; }

        /* ===== Paso 1: compacto (el JS lo activa si no cabe completo) ===== */
        .top-header.nav-compact { padding-left: 20px; padding-right: 20px; gap: 16px; }
        .top-header.nav-compact .nav-item { padding-left: 11px; padding-right: 11px; font-size: 13px; gap: 6px; }
        .top-header.nav-compact .nav-links { gap: 2px; }
        .top-header.nav-compact .header-right { gap: 10px; }
        .top-header.nav-compact .sidebar-brand img { height: 42px; }

        /* ===== Paso 2: el buscador se vuelve un icono que abre la caja al tocarlo ===== */
        .top-header.nav-search-icon .header-right .search-box {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 36px;
            width: 36px;
            min-width: 36px;
            height: 36px;
            padding: 0;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            cursor: pointer;
        }
        .top-header.nav-search-icon .header-right .search-box > i { position: static; transform: none; margin: 0; }
        .top-header.nav-search-icon .header-right .search-box input { display: none; }
        .top-header.nav-search-icon .header-right .search-box.search-open input {
            display: block;
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            z-index: 60;
            width: min(300px, calc(100vw - 24px));
            height: 44px;
            padding: 0 18px;
            color: #fff;
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        /* ===== Paso 3: enlaces del menú solo con texto ===== */
        .top-header.nav-tight .nav-item > i { display: none; }

        /* ===== Paso 4: colapsado en hamburguesa (el JS lo activa si ni compacto cabe) ===== */
        .top-header.nav-collapsed {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            height: auto;
            min-height: 72px;
            padding-top: 10px;
            padding-bottom: 10px;
            gap: 10px 12px;
        }
        .top-header.nav-collapsed.menu-open { max-height: 100vh; max-height: 100dvh; overflow-y: auto; }

        .top-header.nav-collapsed .sidebar-brand { order: 1; margin-right: auto; }
        .top-header.nav-collapsed .header-right  { order: 2; display: flex; align-items: center; gap: 10px; margin: 0; }
        .top-header.nav-collapsed .menu-toggle {
            order: 3;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 22px;
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            cursor: pointer;
        }
        .top-header.nav-collapsed .menu-toggle:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 2px; }

        .top-header.nav-collapsed .header-right .search-box { display: none; }

        .top-header.nav-collapsed .nav-links {
            order: 4;
            display: none;
            flex-direction: column;
            flex: 1 1 100%;
            width: 100%;
            gap: 4px;
            margin: 0;
            padding: 10px 0 4px;
            position: static;
            overflow: visible;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .top-header.nav-collapsed.menu-open .nav-links { display: flex; }

        .top-header.nav-collapsed .nav-links .search-box {
            display: flex;
            align-items: center;
            flex: none;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            margin: 0 0 6px;
        }
        .top-header.nav-collapsed .nav-links .search-box input { min-width: 0; width: 100%; }

        .top-header.nav-collapsed .nav-links .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            font-size: 14px;
            border-radius: 10px;
            white-space: normal;
        }
        .top-header.nav-collapsed .nav-links .nav-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; }

        /* ===== Tamaños pequeños ===== */
        @media (max-width: 640px) {
            .top-header.nav-collapsed { padding-left: 12px; padding-right: 12px; gap: 8px; }
            .top-header .sidebar-brand img { height: 36px; }
            .top-header .role-badge { display: none; }
            .content-area { padding-left: 14px; padding-right: 14px; }
        }
        @media (max-width: 360px) {
            .top-header .sidebar-brand img { height: 28px; }
        }
    </style>
</head>

            var btn = document.getElementById('menuToggle');
            if (!header || !btn) return;
            var icon = btn.querySelector('i');
            var raf = null;

            function setOpen(open) {
                header.classList.toggle('menu-open', open);
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                btn.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
                icon.className = open ? 'ph ph-x' : 'ph ph-list';
            }

            // true si el contenido del header no cabe en una sola fila
            function overflows() {
                return header.scrollWidth > header.clientWidth + 1;
            }

            var steps = ['nav-compact', 'nav-search-icon', 'nav-tight'];
            var searchBox = header.querySelector('.header-right .search-box');

            function closeSearch() {
                if (searchBox) searchBox.classList.remove('search-open');
            }

            // Va comprimiendo paso a paso y se queda con el primero que quepa.
            // Solo si ni así cabe, usa la hamburguesa.
            function fit() {
                var i;
                header.classList.remove('nav-collapsed');
                for (i = 0; i < steps.length; i++) header.classList.remove(steps[i]);
                closeSearch();
                if (!overflows()) { setOpen(false); return; }
                for (i = 0; i < steps.length; i++) {
                    header.classList.add(steps[i]);
                    if (!overflows()) { setOpen(false); return; }
                }
                for (i = 0; i < steps.length; i++) header.classList.remove(steps[i]);
                header.classList.add('nav-collapsed');
            }

            function schedule() {
                if (raf) cancelAnimationFrame(raf);
                raf = requestAnimationFrame(fit);
            }

            btn.addEventListener('click', function () {
                setOpen(!header.classList.contains('menu-open'));
            });
            header.querySelectorAll('.nav-links a').forEach(function (a) {
                a.addEventListener('click', function () { setOpen(false); });
            });

            if (searchBox) {
                searchBox.addEventListener('click', function (e) {
                    if (!header.classList.contains('nav-search-icon')) return;
                    if (e.target.tagName === 'INPUT') return;
                    var open = !searchBox.classList.contains('search-open');
                    searchBox.classList.toggle('search-open', open);
                    if (open) searchBox.querySelector('input').focus();
                });
                document.addEventListener('click', function (e) {
                    if (!searchBox.contains(e.target)) closeSearch();
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') closeSearch();
                });
            }

            window.addEventListener('resize', schedule);
            window.addEventListener('load', schedule);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
            fit();
        })();
    </script>

</body>
</html>
