{# templates/chat.html #}
{% extends "base.html" %}

{% block content %}
<style>
    .chat-app {
        --c-fondo: #000;
        --c-panel: #0d0d0d;
        --c-burbuja: #1a1a1a;
        --c-mia: #e6d9bd;
        --c-linea: rgba(255, 255, 255, 0.1);
        --c-muted: var(--text-muted, #9a9a9a);
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        height: calc(100vh - 140px);
        height: calc(100dvh - 140px);
        min-height: 420px;
        background: var(--c-fondo);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        overflow: hidden;
    }

    /* ---------- Lista de conversaciones ---------- */
    .chat-side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-y: auto;
        border-right: 1px solid var(--c-linea);
        -webkit-overflow-scrolling: touch;
    }
    .chat-side-top { display: none; }
    .chat-side h2 {
        margin: 0;
        padding: 14px 16px 6px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--c-muted);
    }
    .chat-sala {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 16px;
        font: inherit;
        text-align: left;
        color: #fff;
        background: none;
        border: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .chat-sala:hover { background: rgba(255, 255, 255, 0.05); }
    .chat-sala:active { background: rgba(255, 255, 255, 0.09); }
    .chat-sala.on { background: rgba(255, 255, 255, 0.1); }
    .chat-sala:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: -2px; }
    .chat-av {
        flex: none;
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        font-size: 18px;
        font-weight: 600;
        color: #111;
        background: var(--c-mia);
        border-radius: 50%;
    }
    .chat-av.canal { color: #fff; background: #2b2b2b; }
    .chat-sala-txt { display: flex; flex-direction: column; min-width: 0; font-size: 16px; line-height: 1.25; }
    .chat-sala-txt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-sala-txt small { font-size: 13px; color: var(--c-muted); }

    /* ---------- Conversación ---------- */
    .chat-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--c-fondo); }
    .chat-top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--c-panel);
        border-bottom: 1px solid var(--c-linea);
    }
    .chat-back {
        display: none;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        margin-left: -6px;
        font-size: 22px;
        color: #fff;
        background: none;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .chat-back:active { background: rgba(255, 255, 255, 0.1); }
    .chat-top .chat-av { width: 40px; height: 40px; font-size: 16px; }
    .chat-top-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
    #chatTitulo { font-weight: 500; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-top small { font-size: 12px; color: var(--c-muted); }

    .chat-scroll { position: relative; flex: 1; display: flex; min-height: 0; }
    #chatMsgs {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
        padding: 14px 14px 10px;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
    }
    .chat-vacio { margin: auto; padding: 0 20px; text-align: center; font-size: 15px; color: var(--c-muted); }
    .chat-dia {
        align-self: center;
        margin: 6px 0;
        padding: 3px 12px;
        font-size: 12px;
        text-transform: capitalize;
        color: var(--c-muted);
        background: var(--c-burbuja);
        border-radius: 999px;
    }
    .chat-m {
        align-self: flex-start;
        max-width: min(78%, 560px);
        padding: 7px 11px 5px;
        font-size: 16px;
        line-height: 1.38;
        background: var(--c-burbuja);
        border-radius: 16px 16px 16px 4px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
    }
    .chat-m.yo {
        align-self: flex-end;
        color: #111;
        background: var(--c-mia);
        border-radius: 16px 16px 4px 16px;
    }
    .chat-m.cont { margin-top: -5px; }
    .chat-m b { display: block; margin-bottom: 1px; font-size: 13px; font-weight: 600; color: var(--c-mia); }
    .chat-m time { float: right; margin: 6px 0 0 12px; font-size: 11px; line-height: 1; opacity: .55; }
    .chat-m::after { content: ""; display: block; clear: both; }

    #chatAbajo {
        position: absolute;
        right: 14px;
        bottom: 12px;
        display: none;
        place-items: center;
        width: 40px;
        height: 40px;
        font-size: 18px;
        color: #fff;
        background: #2b2b2b;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
        cursor: pointer;
    }
    #chatAbajo.ver { display: grid; }

    #chatErr { padding: 0 16px; font-size: 13px; color: #ff6b6b; }
    #chatErr:not(:empty) { padding-bottom: 6px; }
    .chat-form {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 8px 10px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        background: var(--c-panel);
        border-top: 1px solid var(--c-linea);
    }
    .chat-form textarea {
        flex: 1;
        min-width: 0;
        height: 44px;
        max-height: 140px;
        padding: 11px 16px;
        box-sizing: border-box;
        font: inherit;
        font-size: 16px; /* 16px evita el zoom automático en iPhone */
        line-height: 22px;
        color: #fff;
        background: #1a1a1a;
        border: 1px solid transparent;
        border-radius: 22px;
        resize: none;
    }
    .chat-form textarea::placeholder { color: var(--c-muted); }
    .chat-form textarea:focus { outline: none; border-color: rgba(255, 255, 255, 0.3); }
    .chat-form button {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        font-size: 20px;
        color: #111;
        background: var(--c-mia);
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .chat-form button:disabled { opacity: .45; cursor: default; }

    /* ---------- Celular: estilo WhatsApp / Telegram ---------- */
    @media (max-width: 760px) {
        .chat-app {
            display: block;
            height: calc(100vh - 120px);
            height: calc(100dvh - 120px);
            border-radius: 12px;
        }
        .chat-side { height: 100%; border-right: 0; }
        .chat-side-top { display: block; padding: 14px 16px 4px; font-size: 22px; font-weight: 600; }
        .chat-main { display: none; }
        .chat-app.abierto .chat-main {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--vh, 100dvh);
            z-index: 2000;
        }
        .chat-back { display: grid; }
        .chat-top { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
        .chat-m { max-width: 85%; }
        #chatMsgs { padding: 12px 10px 8px; }
    }
    @media (prefers-reduced-motion: no-preference) {
        .chat-m { animation: chatIn .15s ease-out; }
        @keyframes chatIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    }
</style>

<div class="chat-app" id="chatApp">
    <aside class="chat-side" aria-label="Conversaciones">
        <div class="chat-side-top">Chats</div>
        <h2>Canales</h2>
        <button type="button" class="chat-sala on" data-sala="general" data-nombre="General">
            <span class="chat-av canal">#</span>
            <span class="chat-sala-txt"><span>General</span><small>Todo el equipo</small></span>
        </button>
        <h2>Mensajes directos</h2>
        <div id="chatContactos"></div>
    </aside>

    <section class="chat-main" id="chatMain">
        <div class="chat-top">
            <button type="button" class="chat-back" id="chatBack" aria-label="Volver a los chats"><i class="ph ph-arrow-left"></i></button>
            <span class="chat-av canal" id="chatAvTop">#</span>
            <div class="chat-top-txt">
                <span id="chatTitulo">General</span>
                <small><i class="ph ph-lock-simple"></i> Cifrado AES-256-GCM</small>
            </div>
        </div>
        <div class="chat-scroll">
            <div id="chatMsgs" aria-live="polite"></div>
            <button type="button" id="chatAbajo" aria-label="Ir al último mensaje"><i class="ph ph-caret-down"></i></button>
        </div>
        <div id="chatErr" role="alert"></div>
        <form class="chat-form" id="chatForm" autocomplete="off">
            <textarea id="chatTexto" maxlength="2000" rows="1" placeholder="Mensaje" aria-label="Mensaje" enterkeyhint="send" required></textarea>
            <button type="submit" id="chatEnviar" aria-label="Enviar"><i class="ph ph-paper-plane-right"></i></button>
        </form>
    </section>
</div>

<script>
    (function () {
        var sala = 'general', ultimo = 0, ultimoDia = '', cargando = false;
        var prev = { nombre: null, yo: null, t: 0 };
        var $ = function (id) { return document.getElementById(id); };
        var app = $('chatApp'), cont = $('chatMsgs'), txt = $('chatTexto'), btnEnviar = $('chatEnviar'), btnAbajo = $('chatAbajo');
        var movil = window.matchMedia('(max-width: 760px)');
        var tactil = window.matchMedia('(pointer: coarse)').matches;

        function fecha(s) { return new Date(s + 'Z'); }
        function hora(d) { return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); }
        function dia(d) {
            var hoy = new Date(), ayer = new Date();
            ayer.setDate(hoy.getDate() - 1);
            if (d.toDateString() === hoy.toDateString()) return 'Hoy';
            if (d.toDateString() === ayer.toDateString()) return 'Ayer';
            return d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        function inicial(n) { return (n || '?').trim().charAt(0).toUpperCase(); }
        function alFondo() { cont.scrollTop = cont.scrollHeight; }
        function cercaDelFondo() { return cont.scrollHeight - cont.scrollTop - cont.clientHeight < 80; }

        function vacio() {
            if (cont.children.length) return;
            var v = document.createElement('div');
            v.className = 'chat-vacio';
            v.id = 'chatVacio';
            v.textContent = 'Aún no hay mensajes. Escribe el primero.';
            cont.appendChild(v);
        }

        function pintar(m) {
            var ph = $('chatVacio');
            if (ph) ph.remove();
            var d = fecha(m.creado), k = d.toDateString();
            if (k !== ultimoDia) {
                ultimoDia = k;
                prev = { nombre: null, yo: null, t: 0 };
                var sep = document.createElement('div');
                sep.className = 'chat-dia';
                sep.textContent = dia(d);
                cont.appendChild(sep);
            }
            // Mensajes seguidos de la misma persona (menos de 5 min) se agrupan
            var agrupado = prev.yo === !!m.yo && prev.nombre === m.nombre && (d - prev.t) < 300000;
            var el = document.createElement('div');
            el.className = 'chat-m' + (m.yo ? ' yo' : '') + (agrupado ? ' cont' : '');
            if (!m.yo && !agrupado && sala === 'general') {
                var b = document.createElement('b');
                b.textContent = m.nombre;
                el.appendChild(b);
            }
            el.appendChild(document.createTextNode(m.texto));
            var t = document.createElement('time');
            t.textContent = hora(d);
            el.appendChild(t);
            cont.appendChild(el);
            prev = { nombre: m.nombre, yo: !!m.yo, t: d };
        }

        async function cargar(reset) {
            if (cargando) return;
            cargando = true;
            if (reset) { cont.innerHTML = ''; ultimo = 0; ultimoDia = ''; prev = { nombre: null, yo: null, t: 0 }; }
            var miSala = sala;
            try {
                var r = await fetch('/api/chat/mensajes?sala=' + encodeURIComponent(miSala) + '&desde=' + ultimo, { credentials: 'same-origin' });
                if (!r.ok || miSala !== sala) return;
                var j = await r.json();
                var abajo = cercaDelFondo();
                j.mensajes.forEach(function (m) { pintar(m); ultimo = m.id; });
                if (reset) vacio();
                if (j.mensajes.length && (abajo || reset)) alFondo();
            } catch (e) {
            } finally {
                cargando = false;
            }
        }

        /* ---- Navegación lista <-> conversación (celular) ---- */
        function abrirVista() {
            if (!movil.matches || app.classList.contains('abierto')) return;
            app.classList.add('abierto');
            document.body.style.overflow = 'hidden';
            history.pushState({ chat: 1 }, '');
            ajustarVista();
        }
        function cerrarVista() {
            if (!app.classList.contains('abierto')) return;
            app.classList.remove('abierto');
            document.body.style.overflow = '';
            $('chatMain').style.top = '';
        }
        $('chatBack').addEventListener('click', function () {
            if (history.state && history.state.chat) history.back(); else cerrarVista();
        });
        window.addEventListener('popstate', cerrarVista);
        movil.addEventListener && movil.addEventListener('change', function () { if (!movil.matches) cerrarVista(); });

        /* ---- Ajuste al teclado virtual ---- */
        function ajustarVista() {
            var vv = window.visualViewport;
            var h = vv ? vv.height : window.innerHeight;
            app.style.setProperty('--vh', h + 'px');
            if (app.classList.contains('abierto')) {
                $('chatMain').style.top = (vv ? vv.offsetTop : 0) + 'px';
                if (document.activeElement === txt) alFondo();
            }
        }
        if (window.visualViewport) {
            visualViewport.addEventListener('resize', ajustarVista);
            visualViewport.addEventListener('scroll', ajustarVista);
        }
        window.addEventListener('resize', ajustarVista);
        ajustarVista();

        function elegir(btn) {
            sala = btn.getAttribute('data-sala');
            var nombre = btn.getAttribute('data-nombre');
            $('chatTitulo').textContent = nombre;
            var av = $('chatAvTop');
            av.textContent = sala === 'general' ? '#' : inicial(nombre);
            av.className = 'chat-av' + (sala === 'general' ? ' canal' : '');
            document.querySelectorAll('.chat-sala').forEach(function (b) { b.classList.remove('on'); });
            btn.classList.add('on');
            $('chatErr').textContent = '';
            cargando = false;
            cargar(true);
            abrirVista();
            if (!movil.matches) txt.focus();
        }

        document.querySelector('.chat-sala[data-sala="general"]').addEventListener('click', function () { elegir(this); });

        fetch('/api/chat/contactos', { credentials: 'same-origin' })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                j.contactos.forEach(function (c) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'chat-sala';
                    b.setAttribute('data-sala', c.sala);
                    b.setAttribute('data-nombre', c.nombre);
                    var av = document.createElement('span');
                    av.className = 'chat-av';
                    av.textContent = inicial(c.nombre);
                    var tx = document.createElement('span');
                    tx.className = 'chat-sala-txt';
                    var n = document.createElement('span');
                    n.textContent = c.nombre;
                    tx.appendChild(n);
                    if (c.cargo) {
                        var s = document.createElement('small');
                        s.textContent = c.cargo;
                        tx.appendChild(s);
                    }
                    b.appendChild(av);
                    b.appendChild(tx);
                    b.addEventListener('click', function () { elegir(b); });
                    $('chatContactos').appendChild(b);
                });
            })
            .catch(function () {});

        /* ---- Envío ---- */
        async function enviar() {
            var t = txt.value.trim();
            if (!t || btnEnviar.disabled) return;
            $('chatErr').textContent = '';
            btnEnviar.disabled = true;
            try {
                var r = await fetch('/api/chat/enviar', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sala: sala, texto: t })
                });
                if (r.ok) {
                    txt.value = '';
                    txt.style.height = '44px';
                    await cargar(false);
                    alFondo();
                } else {
                    var j = {};
                    try { j = await r.json(); } catch (e) {}
                    $('chatErr').textContent = j.error || 'No se pudo enviar.';
                }
            } catch (e) {
                $('chatErr').textContent = 'Sin conexión. Inténtalo de nuevo.';
            } finally {
                btnEnviar.disabled = false;
                txt.focus(); // mantiene el teclado abierto, como WhatsApp
            }
        }

        $('chatForm').addEventListener('submit', function (e) { e.preventDefault(); enviar(); });
        // Evita que el botón le quite el foco al campo (y cierre el teclado)
        btnEnviar.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btnEnviar.addEventListener('touchstart', function (e) { e.preventDefault(); enviar(); }, { passive: false });
        txt.addEventListener('keydown', function (e) {
            // En PC: Enter envía. En celular: Enter = salto de línea, se envía con el botón.
            if (e.key === 'Enter' && !e.shiftKey && !tactil) { e.preventDefault(); enviar(); }
        });
        txt.addEventListener('input', function () {
            txt.style.height = '44px';
            txt.style.height = Math.min(txt.scrollHeight, 140) + 'px';
        });

        /* ---- Botón "ir al final" ---- */
        cont.addEventListener('scroll', function () {
            btnAbajo.classList.toggle('ver', !cercaDelFondo());
        }, { passive: true });
        btnAbajo.addEventListener('click', function () {
            cont.scrollTo({ top: cont.scrollHeight, behavior: 'smooth' });
        });

        cargar(true);
        setInterval(function () { if (!document.hidden) cargar(false); }, 3000);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) cargar(false); });
    })();
</script>
{% endblock %}
